<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}研备 · 考研备考数据管理平台{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <style>
    :root {
      --blue: #2563eb;
      --blue-deep: #1d4ed8;
      --teal: #0d9488;
      --teal-deep: #0f766e;
      --ink: #0f172a;
      --muted: #64748b;
      --bg: #f2f7f9;
      --line: #e2e8f0;
      --shadow: 0 8px 28px rgba(15, 23, 42, .06);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      line-height: 1.6;
      background:
        radial-gradient(1100px 480px at 6% -12%, #dff3f1 0%, rgba(223, 243, 241, 0) 60%),
        radial-gradient(900px 420px at 104% -8%, #e4edff 0%, rgba(228, 237, 255, 0) 55%),
        var(--bg);
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { width: 100%; max-width: 1160px; margin: 0 auto; padding: 0 24px; }

    /* ---------- 顶部导航 ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .nav-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 66px;
    }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); }
    .brand:hover { text-decoration: none; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      box-shadow: 0 5px 14px rgba(37, 99, 235, .28);
    }
    .brand-text { font-size: 17px; font-weight: 800; letter-spacing: .3px; white-space: nowrap; }
    .brand-text em { margin-left: 6px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--muted); }
    nav { display: flex; gap: 4px; }
    nav a {
      padding: 8px 15px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    nav a:hover { background: #eef4f7; color: var(--ink); text-decoration: none; }
    nav a.active {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      box-shadow: 0 5px 14px rgba(37, 99, 235, .28);
    }

    main.container { padding-top: 28px; padding-bottom: 8px; }

    /* ---------- 页面标题 ---------- */
    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .page-head h1 { margin: 0; font-size: 27px; letter-spacing: .3px; }
    .page-head .sub { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
    .head-actions { display: flex; align-items: center; gap: 10px; }
    h2 { margin: 0; font-size: 16px; }
    .sub { color: var(--muted); }

    /* ---------- 卡片 ---------- */
    .card {
      background: #fff;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 20px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    /* ---------- 顶部统计卡片 ---------- */
    .stats-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .stats-grid .card {
      display: flex;
      flex-direction: column;
      min-height: 198px;
      margin-bottom: 0;
    }
    .stat-label { font-size: 13px; font-weight: 700; letter-spacing: .5px; color: var(--muted); }
    .stat-value { margin-top: 8px; font-size: 38px; font-weight: 800; line-height: 1.15; }
    .unit { margin-left: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .stat-hint { margin: auto 0 0; font-size: 13px; color: var(--muted); }

    .countdown {
      border: none;
      color: #fff;
      background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue) 48%, var(--teal) 100%);
      box-shadow: 0 14px 32px rgba(29, 78, 216, .26);
    }
    .countdown .stat-label { color: rgba(255, 255, 255, .8); }
    .countdown-value { margin: 4px 0 10px; font-size: 54px; font-weight: 800; line-height: 1.05; }
    .countdown .unit { color: rgba(255, 255, 255, .85); }
    .countdown-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      font-size: 13px;
      color: rgba(255, 255, 255, .88);
    }
    .stage-pill {
      display: inline-block;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      white-space: nowrap;
    }

    .completion-card .donut { margin-top: auto; }

    /* ---------- 进度条 ---------- */
    .progress {
      height: 9px;
      margin: 12px 0 6px;
      background: #e8eef5;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-sm { height: 7px; margin: 6px 0 0; }
    .progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue), var(--teal));
      transition: width .4s ease;
    }

    /* ---------- 完成率圆环 ---------- */
    .donut {
      position: relative;
      width: 114px;
      height: 114px;
      margin: 8px auto 0;
      border-radius: 50%;
    }
    .donut-inner {
      position: absolute;
      inset: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.1;
      background: #fff;
      border-radius: 50%;
    }
    .donut-inner strong { font-size: 22px; }
    .donut-inner span { margin-top: 2px; font-size: 11px; color: var(--muted); }

    /* ---------- 两栏内容 ---------- */
    .content-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr;
      gap: 20px;
      align-items: start;
    }

    /* ---------- 近 7 天柱状图 ---------- */
    .chart { margin-top: 6px; }
    .chart-plot {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      height: 172px;
      padding: 0 4px;
    }
    .bar-col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; }
    .bar-stack {
      width: 100%;
      max-width: 42px;
      min-height: 3px;
      display: flex;
      flex-direction: column;
      border-radius: 9px 9px 4px 4px;
      overflow: hidden;
      background: #eef2f7;
      transition: height .35s ease;
    }
    .bar-stack > div { flex: 0 0 auto; width: 100%; }
    .bar-pomodoro { background: linear-gradient(180deg, #3b82f6, var(--teal)); }
    .bar-manual { background: #99f6e4; }
    .bar-today {
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgba(13, 148, 136, .32);
    }
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .chart-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
    .dot-pomodoro { background: linear-gradient(135deg, #3b82f6, var(--teal)); }
    .dot-manual { background: #99f6e4; }
    .target-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: var(--target-line);
      border-top: 1px dashed rgba(37, 99, 235, .42);
      pointer-events: none;
    }
    .target-line span {
      position: absolute;
      right: 0;
      top: -21px;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--blue);
      background: #fff;
    }
    .chart-axis { display: flex; gap: 12px; padding: 9px 4px 0; }
    .axis-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }
    .axis-item strong { font-size: 12px; color: var(--ink); }
    .axis-item.is-today strong,
    .axis-item.is-today span { color: var(--teal); }
    .chart-note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }

    /* ---------- 科目进度 ---------- */
    .subject-list { display: flex; flex-direction: column; gap: 14px; }
    .subject-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .subject-count { font-size: 12px; color: var(--muted); }

    /* ---------- 徽章 ---------- */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #0369a1;
      background: #e0f2fe;
      border-radius: 999px;
      white-space: nowrap;
    }
    .pill {
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      background: #e8f0fe;
      border-radius: 999px;
      white-space: nowrap;
    }
    .pill-ok { color: var(--teal-deep); background: #e7f8f1; }
    .date-chip {
      padding: 3px 10px;
      font-size: 12px;
      color: var(--muted);
      background: #f1f5f9;
      border-radius: 999px;
      white-space: nowrap;
    }
    .date-overdue { color: #b91c1c; background: #fee2e2; }
    .study-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin: 4px 0 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .study-breakdown strong { color: var(--ink); }
    .focus-chip {
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
      color: var(--teal-deep);
      background: #e7f8f1;
      border-radius: 999px;
      white-space: nowrap;
    }
    .focus-active-note {
      padding: 14px;
      font-size: 13px;
      color: var(--teal-deep);
      text-align: center;
      background: #f0fdfa;
      border: 1px dashed #99f6e4;
      border-radius: 10px;
    }
    .focus-active-note p { margin: 0; }

    /* ---------- 专注历史 ---------- */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-item {
      padding: 16px;
      background: #fff;
      border: 1px solid rgba(226, 232, 240, .9);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .summary-item span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
    .summary-item strong { font-size: 26px; line-height: 1.25; }
    .summary-item em { margin-left: 4px; font-style: normal; font-size: 12px; color: var(--muted); }
    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .month-form { display: flex; align-items: center; gap: 8px; }
    .month-form input[type="month"] { width: auto; padding: 8px 10px; font-size: 13px; }
    .day-card {
      padding: 16px;
      margin-bottom: 14px;
      background: #fcfdff;
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .day-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .day-head strong { font-size: 15px; }
    .day-head .muted { margin-left: 8px; font-size: 13px; }
    .session-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 10px;
      font-size: 13px;
      background: #fff;
      border: 1px solid #eef2f7;
      border-radius: 10px;
    }
    .session-time { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; color: var(--muted); }
    .session-task { flex: 1; min-width: 120px; }
    .session-min { font-size: 12px; color: var(--muted); }
    .status-mini { padding: 2px 8px; font-size: 11px; font-weight: 700; border-radius: 999px; }
    .status-mini.status-ok { color: #15803d; background: #dcfce7; }
    .status-mini.status-todo { color: #b45309; background: #fef3c7; }
    .manual-row { color: var(--teal-deep); background: #f0fdfa; border-color: #ccfbf1; }
    .form-section-title {
      margin: 2px 0 -4px;
      padding-top: 14px;
      font-size: 13px;
      font-weight: 800;
      color: var(--ink);
      border-top: 1px dashed var(--line);
    }

    /* ---------- 番茄悬浮计时器 ---------- */
    .focus-widget {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 60;
      width: 244px;
      padding: 16px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 46px rgba(15, 23, 42, .2);
    }
    .focus-widget[hidden] { display: none; }
    .focus-ring {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--teal) calc(var(--progress, 0) * 1%), #e8eef5 0);
    }
    .focus-ring::before {
      content: "";
      position: absolute;
      inset: 10px;
      background: #fff;
      border-radius: 50%;
    }
    .focus-time { position: relative; z-index: 1; font-size: 30px; font-weight: 800; line-height: 1; }
    .focus-mode { text-align: center; font-size: 13px; font-weight: 700; color: var(--teal-deep); }
    .focus-meta { min-height: 18px; margin-top: 2px; text-align: center; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .focus-actions { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
    .focus-complete { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); text-align: center; }
    .focus-complete p { margin: 0 0 9px; font-size: 13px; }
    .focus-complete-actions { display: flex; justify-content: center; gap: 8px; }
    .focus-widget.is-break .focus-ring {
      background: conic-gradient(var(--blue) calc(var(--progress, 0) * 1%), #e8eef5 0);
    }
    .focus-widget.is-break .focus-mode { color: var(--blue-deep); }

    /* ---------- 任务列表 ---------- */
    .task-list { list-style: none; margin: 0; padding: 0; }
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px dashed var(--line);
    }
    .task-item:first-child { padding-top: 0; }
    .task-item:last-child { padding-bottom: 0; border-bottom: none; }
    .task-main { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
    .task-text { font-size: 14px; word-break: break-word; }
    .is-done .task-text { color: #94a3b8; text-decoration: line-through; }
    .row-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .row-actions form { margin: 0; }

    /* ---------- 表单 ---------- */
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    input[type="text"],
    input[type="number"],
    input[type="date"],
    input[type="month"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    select { cursor: pointer; }
    input::placeholder,
    textarea::placeholder { color: #94a3b8; }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, .14);
    }
    textarea { min-height: 74px; resize: vertical; }
    .stack-form { display: flex; flex-direction: column; gap: 14px; }
    .form-hint { margin: 0; font-size: 12px; font-weight: 400; color: var(--muted); }

    .plan-form {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr auto;
      gap: 16px;
      align-items: end;
    }
    .settings-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: end;
    }
    .span-2 { grid-column: span 2; }
    .form-actions { display: flex; justify-content: flex-end; }

    /* ---------- 按钮 ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .08s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      box-shadow: 0 6px 16px rgba(37, 99, 235, .25);
    }
    .btn-primary:hover { box-shadow: 0 9px 22px rgba(37, 99, 235, .32); }
    .btn-success { color: var(--teal-deep); background: #e7f8f1; }
    .btn-success:hover { background: #d5f2e6; }
    .btn-ghost { color: var(--ink); background: #fff; border: 1px solid var(--line); }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-danger { color: #b91c1c; background: #fee2e2; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }

    /* ---------- 表格 ---------- */
    .table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .table th {
      padding: 8px 10px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .table td { padding: 11px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    .table tr:last-child td { border-bottom: none; }
    .muted { color: var(--muted); }

    /* ---------- 空状态 ---------- */
    .empty {
      padding: 28px 16px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
      background: #fbfdff;
      border: 1px dashed #dbe4ee;
      border-radius: 12px;
    }

    /* ---------- 提示消息 ---------- */
    .flash-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .flash { padding: 11px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; }
    .flash-success { color: var(--teal-deep); background: #e7f8f1; border: 1px solid #c7ecdd; }
    .flash-error { color: #b91c1c; background: #fef2f2; border: 1px solid #fbd5d5; }

    /* ---------- 欢迎页 ---------- */
    .welcome-card {
      margin-bottom: 20px;
      padding: 30px;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue) 46%, var(--teal) 100%);
      box-shadow: 0 16px 36px rgba(29, 78, 216, .22);
    }
    .welcome-tag {
      display: inline-block;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, .18);
      border: 1px solid rgba(255, 255, 255, .26);
      border-radius: 999px;
    }
    .welcome-card h1 { margin: 12px 0 8px; font-size: 29px; }
    .welcome-card p { max-width: 720px; margin: 0; color: rgba(255, 255, 255, .86); }

    /* ---------- 页脚 ---------- */
    .footer { padding: 24px 0 36px; text-align: center; font-size: 12px; color: #94a3b8; }

    /* ---------- 响应式 ---------- */
    @media (max-width: 1000px) {
      .stats-grid { grid-template-columns: 1fr 1fr; }
      .content-grid { grid-template-columns: 1fr; }
      .plan-form { grid-template-columns: 1fr 1fr; }
      .plan-form .span-2 { grid-column: span 2; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 680px) {
      .nav-wrap { flex-direction: column; align-items: flex-start; justify-content: center; padding: 10px 0; }
      .brand-text em { display: none; }
      .stats-grid { grid-template-columns: 1fr; }
      .page-head { flex-direction: column; align-items: flex-start; }
      .task-item { flex-direction: column; align-items: flex-start; }
      .plan-form,
      .settings-form { grid-template-columns: 1fr; }
      .plan-form .span-2,
      .settings-form .span-2,
      .span-2 { grid-column: span 1; }
      .welcome-card { padding: 24px; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .focus-widget { left: 12px; right: 12px; bottom: 12px; width: auto; }
    }
  </style>
</head>
<body
  data-focus-minutes="{{ focus_config['focus_minutes'] }}"
  data-short-break="{{ focus_config['short_break_minutes'] }}"
  data-long-break="{{ focus_config['long_break_minutes'] }}"
  data-long-every="{{ focus_config['long_break_every'] }}">
  <header class="topbar">
    <div class="container nav-wrap">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">研</span>
        <span class="brand-text">研备<em>备考数据平台</em></span>
      </a>
      <nav>
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' else '' }}">仪表盘</a>
        <a href="{{ url_for('plans') }}" class="{{ 'active' if request.endpoint == 'plans' else '' }}">学习计划</a>
        <a href="{{ url_for('focus_history') }}" class="{{ 'active' if request.endpoint == 'focus_history' else '' }}">专注记录</a>
        <a href="{{ url_for('settings') }}" class="{{ 'active' if request.endpoint in ['settings', 'save_settings'] else '' }}">设置</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="footer">研备 · 课程示意项目 · Flask + SQLite</footer>

  <!-- 全局番茄悬浮计时器 -->
  <div class="focus-widget" id="focus-widget" hidden aria-live="polite">
    <div class="focus-ring" id="focus-ring">
      <span class="focus-time" id="focus-time">25:00</span>
    </div>
    <div class="focus-mode" id="focus-mode">专注中</div>
    <div class="focus-meta" id="focus-meta"></div>
    <div class="focus-actions" id="focus-actions">
      <button class="btn btn-ghost btn-sm" type="button" id="focus-pause">暂停</button>
      <button class="btn btn-danger btn-sm" type="button" id="focus-stop">结束</button>
    </div>
    <div class="focus-complete" id="focus-complete" hidden>
      <p id="focus-complete-text"></p>
      <div class="focus-complete-actions">
        <button class="btn btn-primary btn-sm" type="button" id="focus-primary"></button>
        <button class="btn btn-ghost btn-sm" type="button" id="focus-secondary"></button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
